plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.alishanj.geminiide'
    compileSdk 34

    defaultConfig {
        applicationId "com.alishanj.geminiide"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    // lifecycle-runtime-ktx provides viewLifecycleOwner.lifecycleScope in fragments
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    // Encrypted storage for API key
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    // gson removed — was unused; org.json (built-in) is used instead
}
